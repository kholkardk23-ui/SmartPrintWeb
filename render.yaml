services:
  - type: web
    name: smartprint-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PAYMENT_ENABLED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: "demo"
      - key: UPI_ID
        value: "smartprint@upi"
      - key: UPI_NAME
        value: "SmartPrint Kiosk"
